
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Thread Bangles</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">THREAD BANGLES</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#shop">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">

            <a href="wishlist.html" id="wishlist-link">

            </a>
        </nav>

        <p>Thank you for shopping with Thread Bangles ❤️</p>
        <p>Your order has been received.</p>

            <a href="index.html#shop">Continue Shopping 🛍️</a>
            <a href="cart.html">View Cart 🛒</a>
        </div>

    </section>


    <script src="script.js"></script>

    <script>
        const orderId = localStorage.getItem("orderId");

        document.getElementById("order-id").innerText =
            orderId
                ? "Your Order ID: " + orderId
                : "No recent order found.";
    </script>

</body>
