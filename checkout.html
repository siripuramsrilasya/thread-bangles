<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Thread Bangles</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Thread Bangles</h2>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="wishlist.html" id="wishlist-link">❤️ Wishlist</a>
    </nav>

    <section class="checkout-section">

        <h1>🛍️ Checkout</h1>

        <div class="checkout-box">

            <h2>Order Summary</h2>

            <div id="checkout-items"></div>

            <h3 id="checkout-total">Total: ₹0</h3>

            <h2>Delivery Details</h2>

            <input type="text" id="customer-name" placeholder="Enter your name">

            <input type="text" id="customer-phone" placeholder="Enter phone number">

            <textarea id="customer-address" placeholder="Enter delivery address"></textarea>

            <button onclick="placeOrder()">
                💬 Place Order on WhatsApp
            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
